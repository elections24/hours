<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b5138"><title>THE EYES | Super Admin Login</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:#f3f7f4;font-family:Arial,sans-serif;color:#173327}.card{width:min(430px,100%);padding:28px;background:#fff;border:1px solid #dfe9e2;border-radius:20px;box-shadow:0 18px 55px #12332218}.brand{font-weight:900;letter-spacing:2px;color:#0b5138;margin-bottom:25px}.eyebrow{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#6c927d;font-weight:bold}h1{margin:8px 0;font-size:28px}p{font-size:13px;color:#718078;line-height:1.6}label{display:block;font-size:12px;font-weight:bold;margin:15px 0 7px}input{width:100%;padding:13px;border:1px solid #dfe8e2;border-radius:10px;font:inherit}button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:10px;background:#0b5138;color:white;font-weight:bold}button:disabled{opacity:.6}.notice{display:none;margin-top:13px;padding:12px;border-radius:9px;font-size:12px;line-height:1.5}.notice.show{display:block}.error{background:#fff0ef;color:#b42318}.back{display:block;text-align:center;margin-top:15px;color:#0b5138;font-size:12px;text-decoration:none}
</style></head><body><main class="card"><div class="brand">◉ THE EYES</div><div class="eyebrow">Restricted access</div><h1>Super Administrator</h1><p>Sign in with your Super Administrator credentials. Successful Firebase authentication and role verification will open agent registration.</p>
<form id="form"><label for="loginName">Administrator username or email</label><input id="loginName" type="text" required autocomplete="username" placeholder="superadmin or email"><label for="password">Password</label><input id="password" type="password" required autocomplete="current-password"><button id="btn">Authenticate and continue</button></form><div id="notice" class="notice" role="status"></div><a class="back" href="index.html">Return to ordinary agent login</a></main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {initializeFirestore,doc,getDoc,collection,query,where,getDocs} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig={
  "apiKey": "AIzaSyBEbkeWDLuQOSPz2ojp59UWgqf0OakRrCo",
  "authDomain": "election-8e790.firebaseapp.com",
  "projectId": "election-8e790",
  "storageBucket": "election-8e790.firebasestorage.app",
  "messagingSenderId": "346568561664",
  "appId": "1:346568561664:web:5618be1ebb4057f9c6f4e5"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app);\n// Long polling can improve Firestore reliability on some mobile networks.\nconst db=initializeFirestore(app,{experimentalForceLongPolling:true});
const form=document.getElementById("form"),btn=document.getElementById("btn"),notice=document.getElementById("notice");
function show(t){notice.className="notice show error";notice.textContent=t}
form.addEventListener("submit",async e=>{e.preventDefault();btn.disabled=true;btn.textContent="Verifying…";
try{
const loginValue=document.getElementById("loginName").value.trim();
let emailAddress=loginValue.toLowerCase();
// If the user entered a username rather than an email, find its profile in Firestore.
if(!loginValue.includes("@")){
  const q=query(collection(db,"users"),where("username","==",loginValue));
  const matches=await getDocs(q);
  if(matches.empty) throw Error("Username not found. Check your username or use your registered email.");
  const profile=matches.docs[0].data();
  if(!profile.email) throw Error("This username profile has no email address. Please check the users document.");
  emailAddress=String(profile.email).trim().toLowerCase();
}
const passwordValue=document.getElementById("password").value;
const c=await signInWithEmailAndPassword(auth,emailAddress,passwordValue);
const s=await getDoc(doc(db,"users",c.user.uid));const p=s.exists()?s.data():{};
if(p.role!=="super_admin"||p.active!==true||p.status==="disabled"){await auth.signOut();throw Error("This account is not an active Super Administrator.");}
location.replace("super-admin-dashboard.html");
}catch(err){
let msg=err.message||"Authentication failed.";
if(err.code==="permission-denied") msg="Firestore rules are blocking username lookup. Please allow a secure username lookup or use your registered email for now.";
if(err.code==="unavailable"||String(msg).toLowerCase().includes("offline")) msg="Firestore is unreachable. Check internet connection and Firebase Firestore availability, then retry.";
show(msg);btn.disabled=false;btn.textContent="Authenticate and continue";}});
</script></body></html>
