<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b5138">
<title>THE EYES | Super Admin Login</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:#f3f7f4;font-family:Arial,sans-serif;color:#173327}.card{width:min(430px,100%);padding:28px;background:#fff;border:1px solid #dfe9e2;border-radius:20px;box-shadow:0 18px 55px #12332218}.brand{font-weight:900;letter-spacing:2px;color:#0b5138;margin-bottom:25px}.eyebrow{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#6c927d;font-weight:bold}h1{margin:8px 0;font-size:28px}p{font-size:13px;color:#718078;line-height:1.6}label{display:block;font-size:12px;font-weight:bold;margin:15px 0 7px}input{width:100%;padding:13px;border:1px solid #dfe8e2;border-radius:10px;font:inherit}button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:10px;background:#0b5138;color:white;font-weight:bold;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.notice{display:none;margin-top:13px;padding:12px;border-radius:9px;font-size:12px;line-height:1.5;overflow-wrap:anywhere}.notice.show{display:block}.error{background:#fff0ef;color:#b42318}.success{background:#eaf7ef;color:#176b3a}.back{display:block;text-align:center;margin-top:15px;color:#0b5138;font-size:12px;text-decoration:none}
</style>
</head>
<body>
<main class="card">
  <div class="brand">◉ THE EYES</div><div class="eyebrow">Restricted access</div>
  <h1>Super Administrator</h1>
  <p>Sign in with your Super Administrator username or email. Your account must have an active Super Admin role.</p>
  <form id="form">
    <label for="loginName">Administrator username or email</label>
    <input id="loginName" name="loginName" type="text" required autocomplete="username" autocapitalize="none" spellcheck="false">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required autocomplete="current-password">
    <button id="btn" type="submit">Authenticate and continue</button>
  </form>
  <div id="notice" class="notice" role="status" aria-live="polite"></div>
  <a class="back" href="index.html">Return to ordinary agent login</a>
</main>

<!-- This handler prevents the browser from reloading the page even if Firebase's module fails to load. -->
<script>
(function(){
  const form=document.getElementById('form');
  form.addEventListener('submit',function(event){event.preventDefault();});
  window.showLoginNotice=function(message,kind){
    const notice=document.getElementById('notice');
    notice.className='notice show '+(kind||'error');
    notice.textContent=message;
  };
  window.setLoginBusy=function(busy){
    const button=document.getElementById('btn');
    button.disabled=busy;
    button.textContent=busy?'Verifying…':'Authenticate and continue';
  };
  window.addEventListener('error',function(){
    if(!window.__eyesLoginReady){
      window.showLoginNotice('Login service failed to load. Check your internet connection, then refresh this page. Your entered details will remain in the fields.');
      window.setLoginBusy(false);
    }
  });
})();
</script>

<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,signInWithEmailAndPassword,signOut} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {getFirestore,doc,getDoc} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const firebaseConfig={
  apiKey:'AIzaSyAYMRko87BBNT7LKdZ9s2rGHf1BFmggtb8',
  authDomain:'theeyes-f33cb.firebaseapp.com',
  projectId:'theeyes-f33cb',
  storageBucket:'theeyes-f33cb.firebasestorage.app',
  messagingSenderId:'265085505802',
  appId:'1:265085505802:web:f81fb50567514b806feaf3'
};
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const form=document.getElementById('form');
const loginInput=document.getElementById('loginName');
const passwordInput=document.getElementById('password');

window.__eyesLoginReady=true;
form.addEventListener('submit',async function(event){
  event.preventDefault();
  const enteredLogin=loginInput.value.trim();
  const enteredPassword=passwordInput.value;
  if(!enteredLogin||!enteredPassword){
    window.showLoginNotice('Enter your administrator username/email and password.');
    return;
  }
  window.setLoginBusy(true);
  window.showLoginNotice('Checking your account…','success');
  try{
    // The currently registered Super Admin username is superadmin.
    // Firebase Authentication still authenticates using the account's email.
    let email=enteredLogin;
    if(enteredLogin.toLowerCase()==='superadmin') email='eyes@gmail.com';
    email=email.trim().toLowerCase();

    const credential=await signInWithEmailAndPassword(auth,email,enteredPassword);
    const profileSnapshot=await getDoc(doc(db,'users',credential.user.uid));
    const profile=profileSnapshot.exists()?profileSnapshot.data():null;

    if(!profile || profile.role!=='super_admin' || profile.active!==true || profile.status==='disabled'){
      await signOut(auth);
      throw new Error('This account is not an active Super Administrator. Check the users document for your Firebase Auth UID.');
    }
    window.showLoginNotice('Login successful. Opening Super Admin dashboard…','success');
    window.location.href='super-admin-dashboard.html';
  }catch(error){
    let message='Login failed. Please check your username/email and password.';
    if(error.code==='auth/network-request-failed') message='Network error. Check your internet connection and try again.';
    else if(error.code==='auth/invalid-credential'||error.code==='auth/wrong-password'||error.code==='auth/user-not-found') message='Incorrect username/email or password.';
    else if(error.code==='auth/too-many-requests') message='Too many attempts. Wait a little and try again.';
    else if(error.code==='permission-denied') message='Firebase Firestore denied access to your user profile. Check the Firestore rules for users/{your Firebase Auth UID}.';
    else if(error.code==='unavailable') message='Firestore is temporarily unavailable. Check your connection and try again.';
    else if(error.message) message=error.message;
    window.showLoginNotice(message);
    window.setLoginBusy(false);
    // Deliberately do not clear either field after an error.
  }
});
</script>
</body>
</html>
